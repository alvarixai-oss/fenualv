# Copiar estas reglas al .htaccess del document root SOLO si el hosting usa Apache o LiteSpeed.
# Verificar primero que HTTPS funciona correctamente.

Options -Indexes

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>

<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests"
</IfModule>

# Bloqueo de archivos que no deben ser publicos.
<FilesMatch "(^\.|\.env|\.ini|\.log|\.sql|\.bak|\.backup|\.pem|\.key|\.p12|\.pfx|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock)$">
  Require all denied
</FilesMatch>
