# Fragmento para incluir dentro del server {} HTTPS de Nginx.
# El redirect de HTTP a HTTPS debe configurarse en el server que escucha en el puerto 80.

autoindex off;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests" always;

# Bloquear dotfiles salvo ACME/.well-known.
location ~ /\.(?!well-known/) {
    deny all;
}

# Bloquear extensiones de secretos, copias y configuracion.
location ~* \.(?:env|ini|log|sql|bak|backup|pem|key|p12|pfx)$ {
    deny all;
}

